
name: Build PhotoMagic AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE="PhotoMagicAI_Android_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            ls -la
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/PhotoMagicAI/app/build.gradle" ]; then
            echo "ERROR: Android project not found in ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          cp -a extracted/PhotoMagicAI/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMagicAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
